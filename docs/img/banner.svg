<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Euroly — local-first budget tracker">
  <defs>
    <!-- Plum gradient (matches the app's brand-700 -> brand-950) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#683676"/>
      <stop offset="60%" stop-color="#48294f"/>
      <stop offset="100%" stop-color="#2e1633"/>
    </linearGradient>
    <!-- Subtle dotted texture overlay -->
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
    <!-- Gradient for the logo tile (deep plum) -->
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7f4291"/>
      <stop offset="1" stop-color="#2e1633"/>
    </linearGradient>
    <!-- Soft glow behind the logo -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background layers -->
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>

  <!-- Decorative ledger lines on the right (suggests data without naming it) -->
  <g opacity="0.10" stroke="#fbbf24" stroke-width="2" stroke-linecap="round">
    <line x1="940" y1="80"  x2="1220" y2="80"/>
    <line x1="940" y1="112" x2="1180" y2="112"/>
    <line x1="940" y1="144" x2="1220" y2="144"/>
    <line x1="940" y1="176" x2="1140" y2="176"/>
    <line x1="940" y1="208" x2="1200" y2="208"/>
    <line x1="940" y1="240" x2="1080" y2="240"/>
  </g>
  <!-- Abstract bar chart, very low opacity -->
  <g opacity="0.18" fill="#fbbf24">
    <rect x="1060" y="200" width="18" height="60" rx="4"/>
    <rect x="1090" y="170" width="18" height="90" rx="4"/>
    <rect x="1120" y="140" width="18" height="120" rx="4"/>
    <rect x="1150" y="190" width="18" height="70" rx="4"/>
    <rect x="1180" y="160" width="18" height="100" rx="4"/>
  </g>

  <!-- Logo tile with halo -->
  <circle cx="170" cy="160" r="120" fill="url(#glow)"/>
  <g transform="translate(90 80)">
    <rect x="0" y="0" width="160" height="160" rx="32" fill="url(#tile)"/>
    <path
      d="M110 56c-6.5-7.5-16.25-12-26.75-12C64.25 44 49 59.25 49 78.5S64.25 113 83.25 113c10.5 0 20.25-4.75 26.75-12M40 70h55M40 90h55"
      fill="none" stroke="#fbbf24" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark + tagline (system-ui fallback because GitHub renders SVGs as <img> and won't load custom webfonts) -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Manrope, sans-serif">
    <!-- "Euroly" -->
    <text x="290" y="170" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="-2">Euroly</text>

    <!-- Tagline -->
    <text x="294" y="210" font-size="22" font-weight="500" fill="#e7d3eb" letter-spacing="0.2">
      Personal budget tracker.
      <tspan fill="#fbbf24" font-weight="700"> Local-first.</tspan>
      No cloud. No accounts. No telemetry.
    </text>

    <!-- Stack chips -->
    <g transform="translate(294 240)" font-size="13" font-weight="600" letter-spacing="1.5" fill="#e7d3eb">
      <g>
        <rect x="0" y="0" width="86" height="26" rx="13" fill="#ffffff" fill-opacity="0.10"/>
        <text x="43" y="17" text-anchor="middle">FASTAPI</text>
      </g>
      <g transform="translate(96 0)">
        <rect x="0" y="0" width="66" height="26" rx="13" fill="#ffffff" fill-opacity="0.10"/>
        <text x="33" y="17" text-anchor="middle">REACT</text>
      </g>
      <g transform="translate(172 0)">
        <rect x="0" y="0" width="76" height="26" rx="13" fill="#ffffff" fill-opacity="0.10"/>
        <text x="38" y="17" text-anchor="middle">SQLITE</text>
      </g>
      <g transform="translate(258 0)">
        <rect x="0" y="0" width="106" height="26" rx="13" fill="#fbbf24" fill-opacity="0.18"/>
        <text x="53" y="17" text-anchor="middle" fill="#fbbf24">OPEN SOURCE</text>
      </g>
    </g>
  </g>
</svg>
